<!DOCTYPE html>
<html>
<head>
<title>Crown Agency - Client Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:'Segoe UI',Arial;background:#0a0a0a;color:white}
.header{background:#111;padding:20px;border-bottom:2px solid #D4AF37;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:800;letter-spacing:2px}.logo span{color:#D4AF37}
.container{max-width:900px;margin:30px auto;padding:0 15px}
.card{background:#1a1a1a;padding:24px;border-radius:16px;border:1px solid #333;margin-bottom:20px}
input,select{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#222;color:white;box-sizing:border-box}
button{width:100%;padding:14px;background:linear-gradient(90deg,#D4AF37,#b8960c);color:black;font-weight:bold;border:none;border-radius:10px;cursor:pointer;font-size:16px}
.project{background:#222;padding:16px;border-radius:12px;margin:12px 0;border-left:4px solid #D4AF37;display:flex;justify-content:space-between}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;background:#D4AF37;color:black;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<div class="logo">👑 CROWN <span>AGENCY</span></div>
<div style="font-size:12px;opacity:0.7">Client Flow Hub</div>
</div>
<div class="container">
<div class="card">
<h3 style="margin-top:0;color:#D4AF37">+ New Client Project</h3>
<input id="email" placeholder="Client Email">
<input id="name" placeholder="Project Name">
<select id="status">
<option>Brief Received</option>
<option>In Progress</option>
<option>Review</option>
<option>Delivered</option>
</select>
<input type="file" id="file">
<button onclick="add()">Create Project & Assign to Client</button>
</div>
<div class="card">
<h3 style="margin-top:0">Active Projects</h3>
<div id="list"></div>
</div>
</div>
<script>
let data=JSON.parse(localStorage.getItem('crown2')||'[]');
function render(){
 document.getElementById('list').innerHTML=data.length?data.map((p,i)=>`
 <div class="project">
   <div><b>${p.name}</b><br><small style="opacity:0.7">${p.email} • ${p.file}</small></div>
   <div><span class="badge">${p.status}</span><br><button onclick="del(${i})" style="background:none;color:#888;padding:2px;font-size:12px;width:auto;margin-top:5px">Delete</button></div>
 </div>`).join(''):'<p style="opacity:0.5">No projects yet. Add your first client above.</p>';
}
function add(){
 let e=document.getElementById('email').value;
 let n=document.getElementById('name').value;
 let s=document.getElementById('status').value;
 let f=document.getElementById('file').files[0]?.name||'No file';
 if(!e||!n) return alert('Enter client email and project name');
 data.push({email:e,name:n,status:s,file:f}); localStorage.setItem('crown2',JSON.stringify(data)); render();
 document.getElementById('email').value=''; document.getElementById('name').value='';
 alert('Project created for '+e);
}
function del(i){ data.splice(i,1); localStorage.setItem('crown2',JSON.stringify(data)); render(); }
render();
</script>
</body>
</html>
